<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Cloud Weather App</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif; margin: 0; height: 100vh; display: flex;
            justify-content: center; align-items: center; overflow: hidden;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%) no-repeat center center/cover;
            transition: background 1.2s ease;
        }
        .container {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 40px 30px; border-radius: 24px; text-align: center; width: 350px; color: #ffffff;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .search-box { display: flex; gap: 10px; margin-bottom: 15px; }
        input {
            flex: 1; padding: 14px 16px; font-size: 15px; border-radius: 14px; outline: none;
            border: 1px solid rgba(255, 255, 255, 0.25); background: rgba(255, 255, 255, 0.1); color: #ffffff;
        }
        input::placeholder { color: rgba(255, 255, 255, 0.6); }
        button {
            padding: 14px 24px; font-size: 15px; font-weight: 600; border-radius: 14px;
            border: none; background: #ffffff; color: #1e3c72; cursor: pointer;
        }
        .weather-display { margin-top: 30px; display: none; } /* Hidden by default until search */
        .temp-display { font-size: 4.5rem; font-weight: 700; margin: 15px 0 5px 0; }
        .error-message { color: #ff6b6b; margin-top: 20px; background: rgba(255, 107, 107, 0.1); padding: 10px; border-radius: 10px; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Cloud Weather Engine</h2>
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name..." autocomplete="off">
            <button onclick="getWeather()">Search</button>
        </div>

        <!-- Error panel -->
        <p id="errorBox" class="error-message"></p>

        <!-- Weather info panel -->
        <div id="weatherBox" class="weather-display">
            <h3 id="cityName" style="font-size: 1.4rem; margin: 0; font-weight: 500;"></h3>
            <h1 id="tempDisplay" class="temp-display">°C</h1>
            <p id="descDisplay" style="text-transform: capitalize; margin: 5px 0 0 0;"></p>
        </div>
    </div>

    <!-- JavaScript handles 100% of the live cloud data work instead of Python -->
    <script>
        async function getWeather() {
            const city = document.getElementById('cityInput').value;
            const errorBox = document.getElementById('errorBox');
            const weatherBox = document.getElementById('weatherBox');
            
            // TODO: Swap this string with your real OpenWeatherMap API Key password string
            const apiKey = "YOUR_API_KEY_HERE"; 

            if (!city) return;

            // Hide previous results while searching
            errorBox.style.display = "none";
            weatherBox.style.display = "none";

            try {
                const response = await fetch(`https://openweathermap.org{city}&appid=${apiKey}&units=metric`);
                const data = await response.json();

                if (data.cod === 200) {
                    // Update the layout elements
                    document.getElementById('cityName').innerText = data.name;
                    document.getElementById('tempDisplay').innerText = `${Math.round(data.main.temp)}°C`;
                    document.getElementById('descDisplay').innerText = data.weather[0].description;
                    
                    // Show the display box
                    weatherBox.style.display = "block";

                    // Handle background swapping natively
                    const condition = data.weather[0].main.toLowerCase();
                    const body = document.body;

                    if (condition.includes("clear")) {
                        body.style.backgroundImage = "url('https://unsplash.com')"; 
                    } else if (condition.includes("cloud")) {
                        body.style.backgroundImage = "url('https://unsplash.com')"; 
                    } else if (condition.includes("rain") || condition.includes("drizzle")) {
                        body.style.backgroundImage = "url('https://unsplash.com')"; 
                    } else if (condition.includes("snow")) {
                        body.style.backgroundImage = "url('https://unsplash.com')"; 
                    }
                } else {
                    errorBox.innerText = "City not found. Try again!";
                    errorBox.style.display = "block";
                }
            } catch (error) {
                errorBox.innerText = "Network connection failed.";
                errorBox.style.display = "block";
            }
        }
    </script>
</body>
</html>
