<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Weather Dashboard</title>
    
    <!-- Smart link works perfectly on BOTH Localhost and GitHub Pages links -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') if url_for else '../static/style.css' }}" onerror="this.href='../static/style.css'">
</head>
<body>

    <div class="container">
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Search city..." autocomplete="off">
            <button onclick="getWeather()">Search</button>
        </div>
        <div id="weatherContent"></div>
    </div>

    <script>
        async function getWeather() {
            const city = document.getElementById('cityInput').value;
            const contentDiv = document.getElementById('weatherContent');
            
            // If running on Local Flask server, it reads python's variable. If on GitHub, put your key string here:
            const apiKey = "{{ api_key }}" === "" || "{{ api_key }}".includes("{") ? "YOUR_API_KEY_HERE" : "{{ api_key }}";

            if (!city) return;

            try {
                const response = await fetch(`https://openweathermap.org{city}&appid=${apiKey}&units=metric`);
                const data = await response.json();

                if (data.cod === 200) {
                    contentDiv.innerHTML = `
                        <div class="weather-display">
                            <h3 class="city-label">${data.name}</h3>
                            <div class="temp-wrapper">
                                <img src="https://openweathermap.org{data.weather[0].icon}@4x.png" class="weather-icon">
                                <h1 class="temp-display">${Math.round(data.main.temp)}°C</h1>
                            </div>
                            <p class="desc-display">${data.weather[0].description}</p>
                            <div class="stats-grid">
                                <div class="stat-card"><span class="stat-emoji">💧</span><p class="stat-title">Humidity</p><p class="stat-value">${data.main.humidity}%</p></div>
                                <div class="stat-card"><span class="stat-emoji">💨</span><p class="stat-title">Wind</p><p class="stat-value">${Math.round(data.wind.speed * 3.6)} km/h</p></div>
                                <div class="stat-card"><span class="stat-emoji">🧭</span><p class="stat-title">Pressure</p><p class="stat-value">${data.main.pressure} hPa</p></div>
                            </div>
                        </div>
                    `;

                    const condition = data.weather[0].main.toLowerCase();
                    if (condition.includes("clear")) document.body.style.backgroundImage = "url('https://unsplash.com')";
                    else if (condition.includes("cloud")) document.body.style.backgroundImage = "url('https://unsplash.com')";
                    else document.body.style.backgroundImage = "url('https://unsplash.com')";
                } else {
                    contentDiv.innerHTML = `<p class="error-message">City not found!</p>`;
                }
            } catch (err) {
                contentDiv.innerHTML = `<p class="error-message">Connection failed.</p>`;
            }
        }
    </script>
</body>
</html>
