<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Weather Dashboard</title>
    
    <!-- This single line tells Python to look inside the static folder for style.css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <form class="search-box" method="POST">
            <input type="text" name="city" placeholder="Search city..." required autocomplete="off">
            <button type="submit">Search</button>
        </form>

        {{ content | safe }}
    </div>

    <script>
        document.body.style.backgroundImage = "url('{{ background | safe }}')";
    </script>

</body>
</html>
